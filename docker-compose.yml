name: njs-eatery

# NOTE: This environment cannot create veth/bridge interfaces, so all services
# use host networking. Containers share the host's network namespace and reach
# each other via localhost. Port "mapping" is just the port each service binds.

services:
  db:
    image: postgres:16-alpine
    container_name: njs-db
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-njs_cafe}
    # Bind to 5433 by default so an existing host Postgres on 5432 is untouched
    command: ["-p", "${POSTGRES_PORT:-5433}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-njs_cafe} -p ${POSTGRES_PORT:-5433}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      network: host
    container_name: njs-backend
    restart: unless-stopped
    network_mode: host
    environment:
      # Points at the docker Postgres container (host networking => localhost), NOT your existing database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@localhost:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-njs_cafe}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-prod}
      ALGORITHM: HS256
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    # Schema is created by init_db() -> SQLModel.metadata.create_all() at startup.
    # alembic is used for fresh-DB bootstraps (single clean initial migration);
    # a pre-existing dev DB created by create_all() is left untouched.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "${BACKEND_PORT:-8000}", "--reload"]

  frontend:
    build:
      context: ./frontend/app
      network: host
    container_name: njs-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:${BACKEND_PORT:-8000}}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend/app:/app
      # keep the container's own build output separate from the host .next
      - /app/.next
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "${FRONTEND_PORT:-3000}"]

volumes:
  postgres_data:
